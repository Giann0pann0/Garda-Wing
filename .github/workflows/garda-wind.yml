name: Garda Wind

# Gira nel cloud, non sul Mac. Quattro volte al giorno: i modelli globali
# escono ogni 6 ore, piu' spesso sarebbe traffico sprecato.
# ATTENZIONE: gli orari cron di GitHub sono in UTC.
on:
  schedule:
    - cron: "20 3,9,15,21 * * *"
  workflow_dispatch:          # per lanciarlo a mano dalla pagina Actions
  # E a ogni modifica del codice. Senza questo, pubblicare una versione nuova
  # voleva dire spingere il codice e poi ASPETTARE la prossima esecuzione
  # programmata - fino a sei ore in cui il sito mostra la versione vecchia e
  # sembra che la patch non sia arrivata. Il sito e' generato dal codice:
  # quando il codice cambia, il sito va rifatto.
  push:
    branches: [main]
    paths:
      - "gardawind/**"
      - ".github/workflows/garda-wind.yml"
      # "storico/**" NON e' in elenco, di proposito: il job stesso scrive li'
      # dentro (vedi "Metti al sicuro le serie irripetibili"), e un push che
      # rilancia il job che lo ha fatto e' un ciclo che non si ferma piu'.

permissions:
  # contents: write, e non read, per una ragione sola: dopo il ciclo il job
  # rimette nel progetto le serie che NON si riscaricano (storico/vivo,
  # storico/emesse, storico/altrui). Vedi gardawind/archivio.py.
  contents: write
  pages: write
  id-token: write

concurrency:
  group: garda-wind
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Il database e' l'unica cosa che deve sopravvivere fra un'esecuzione e
      # l'altra: contiene i quattordici anni di Torbole e tutto lo storico gia'
      # scaricato. La chiave cambia ogni giorno e si ripesca la piu' recente,
      # cosi' ogni esecuzione riparte da dove si era arrivati.
      #
      # RIPRISTINA e SALVA sono due passi separati, e non e' un dettaglio:
      # `actions/cache` salva nel suo post-passo solo se il job e' RIUSCITO
      # (post-if: success()). Finche' i controlli della salute non potevano
      # dire di no, il job era sempre verde e la cosa non si vedeva. Adesso che
      # possono, un giro rosso - per esempio una centralina muta per una
      # settimana - non salverebbe il database, e il giro dopo ripartirebbe da
      # quello dell'ultimo giro verde: lavoro rifatto ogni volta, e per giunta
      # con il biglietto dell'archivio tornato indietro, che accende un SECONDO
      # allarme, falso. Il salvataggio va fatto comunque: il rosso serve a dire
      # che qualcosa non torna, non a buttare via il lavoro di questo giro.
      - name: Ripristina il database
        uses: actions/cache/restore@v4
        with:
          path: dati
          # Il tentativo, non solo l'esecuzione: github.run_id NON cambia
          # quando si premono "Re-run all jobs", e una chiave che esiste gia'
          # non viene sovrascritta. Una ri-esecuzione riuscita rischiava di non
          # salvare il proprio lavoro, e il giro dopo ripescava la copia di
          # prima: sito giusto, database tornato indietro, e come unica traccia
          # una riga arancione dentro un passo verde.
          key: gardawind-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            gardawind-db-

      # Cancello prima di pubblicare, ma solo quando il codice e' cambiato:
      # il sito e' generato dal codice, quindi un codice rotto pubblicherebbe
      # un sito rotto con l'aria di essere giusto. Sulle esecuzioni
      # programmate si salta - il codice e' lo stesso di prima, e cinque
      # minuti quattro volte al giorno non comprerebbero niente.
      - name: Controlli
        if: github.event_name != 'schedule'
        # Ogni file di controllo si sceglie il suo database temporaneo, e
        # quelli che non lo fanno non aprono nessun database. Questa riga lo
        # rende strutturale invece che fidato: qualunque cosa i controlli
        # scrivano, non puo' finire nel database vero che sta in "dati".
        env:
          GARDAWIND_HOME: /tmp/gardawind-controlli
        run: python3 test/tutti.py

      - name: Raccogli, addestra, esporta
        env:
          GARDAWIND_HOME: dati
        run: |
          mkdir -p dati
          python3 -m gardawind --ci --export site

      # Le serie irripetibili tornano nel repository. La cache di GitHub
      # cancella le copie non usate da 7 giorni e ne tiene 10 GB in tutto:
      # col database da mezzo giga riscritto a ogni esecuzione fa circa
      # quattro giorni di profondita'. Per i quattordici anni di Torbole -
      # che si riscaricano - va benissimo; per i dieci minuti del canale
      # vivo, che non esistono da nessun'altra parte, no.
      #
      # Il passo non fa fallire la build: se il push non riesce (un altro
      # push nel frattempo), i dati restano nella cache e il giro dopo ci
      # riprova. Perdere la pubblicazione del sito per un conflitto di git
      # sarebbe peggio del ritardo di sei ore nel salvataggio.
      - name: Metti al sicuro le serie irripetibili
        continue-on-error: true
        run: |
          # Il biglietto va nella cartella dei dati (quella che finisce in
          # cache), e lo scrive SOLO un push vero: e' l'unica cosa che
          # distingue "non e' riuscito una volta" da "non riesce da giugno",
          # ed e' il controllo 3 della salute a leggerlo.
          #
          # Lo scrive Python e non `date`, perche' il formato e il nome del
          # file sono un contratto fra questo passo e salute.py: scritti in due
          # posti, il giorno che uno dei due cambia l'altro non protesta, resta
          # semplicemente verde per sempre.
          #
          # E "niente di nuovo da archiviare" NON e' un successo, anche se
          # l'archivio in quel momento e' allineato: senza commit il
          # repository non ha attivita', ed e' l'altra meta' di quello che
          # questo controllo promette (dopo 60 giorni di inattivita' GitHub
          # spegne i cron da solo). Se succede tre giorni di fila vuol dire che
          # non stiamo pubblicando curve nuove, e va detto.
          marca() { python3 -c 'from gardawind import salute; print("  archivio: " + salute.marca_push_riuscito())'; }
          if [ -z "$(git status --porcelain storico)" ]; then
            echo "niente di nuovo da archiviare, e quindi nessun commit: se si ripete, il controllo 3 lo dira'"
            exit 0
          fi
          git config user.name  "garda-wind (archivio)"
          git config user.email "noreply@anthropic.com"
          git add storico
          git commit -m "Archivio: le serie che non si riscaricano, $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && marca && exit 0
            echo "tentativo $i non riuscito, riprovo"; sleep 5
          done
          echo "non sono riuscito a spingere l'archivio: resta in cache, riprovo al prossimo giro"

      # Il salvataggio del database, e `if: always()` e' tutto il punto: il
      # lavoro di questo giro - lo scaricato, il riaddestrato, il biglietto
      # dell'archivio - si salva anche quando la salute fara' diventare rosso
      # il pallino piu' sotto. Il rosso dice che qualcosa non torna; buttare
      # via il giro sarebbe una seconda punizione, e quella vera.
      - name: Salva il database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: dati
          key: gardawind-db-${{ github.run_id }}-${{ github.run_attempt }}

      # Rete di sicurezza: se la cache viene sfrattata, il database resta
      # scaricabile dalla pagina dell'esecuzione per 90 giorni.
      - name: Conserva una copia del database
        uses: actions/upload-artifact@v4
        with:
          name: gardawind-db
          path: dati/*.sqlite
          retention-days: 90
          if-no-files-found: warn

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # ULTIMO passo, e volutamente dopo la pubblicazione. Il giro lungo ingoia
      # i propri errori di proposito - una fonte giu' non deve impedire al sito
      # di aggiornarsi - ma cosi' un'esecuzione che riusciva a meta' restava
      # verde: se Open-Meteo rispondeva 429 al primo passo, il sito veniva
      # ricostruito dal database vecchio e ci stampava sopra "previsione
      # calcolata adesso". Qui si chiede: quello che abbiamo appena pubblicato
      # e' il risultato di questo giro, o roba vecchia con una data nuova?
      # (Vedi gardawind/salute.py per i quattro controlli e per quello che di
      # proposito NON fa diventare rosso il pallino.)
      #
      # Sta dopo l'artefatto perche' il sito deve uscire comunque: un sito
      # vecchio pubblicato e' meglio di nessun sito, purche' qualcuno lo sappia.
      - name: Controlla la salute del giro
        env:
          GARDAWIND_HOME: dati
        run: python3 -m gardawind --salute

  pubblica:
    # Anche se il passo della salute ha fatto fallire il giro: l'artefatto c'e'
    # gia' e va pubblicato. Il rosso serve a chi guarda, non a togliere il sito
    # a chi lo usa.
    if: ${{ !cancelled() }}
    needs: aggiorna
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
